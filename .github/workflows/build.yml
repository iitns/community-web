name: Build and Push Community Web Image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app.py'
      - 'templates/**'
      - 'requirements.txt'
      - 'Dockerfile'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU and Buildx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          docker buildx create --name multiarch --use
          docker buildx inspect --bootstrap

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t ghcr.io/${{ github.repository_owner }}/community-web:latest \
            -t ghcr.io/${{ github.repository_owner }}/community-web:${{ github.sha }} \
            .

      - name: Checkout k8s-manifests
        uses: actions/checkout@v4
        with:
          repository: iitns/k8s-manifests
          token: ${{ secrets.K8S_MANIFESTS_PAT }}
          path: k8s-manifests

      - name: Update oracle-community-web image tag
        run: |
          sed -i "s|image: ghcr.io/iitns/community-web:.*|image: ghcr.io/iitns/community-web:${{ github.sha }}|" \
            k8s-manifests/apps/oracle-community-web/deployment.yaml
          cd k8s-manifests
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update community-web image to ${{ github.sha }}"
          git push
